services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  mlflow-ui:
    build: .
    command: >
      sh -c "pip install mlflow && mlflow ui --host 0.0.0.0 --port 5000
      --backend-store-uri file:///app/mlruns"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
